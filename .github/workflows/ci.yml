name: CLARIUS Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libpq-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic duckdb sqlparse pypdf pdfplumber cryptography PyJWT passlib chromadb requests pydantic-settings httpx sse-starlette openpyxl

    - name: Run Platform Test Suites
      run: |
        cd backend
        python run_tests.py
